[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200

build_flags = 
    -D ARDUINO_TEENSY41
    -D USB_SERIAL
    -O2
    -Wall

lib_deps = 
    SPI
    Wire
    bolderflight/Bolder Flight Systems MPU9250 @ ^1.0.2
